name = "telegram-claude-bot"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# Non-secret config (secrets go via `wrangler secret put`, see README)
[vars]
ALLOWED_USER_IDS = "8439199295"
# GitHub-backed posture tracker. Edit these to your repo; set the token with:
#   wrangler secret put GITHUB_TOKEN
GITHUB_OWNER = "lawheitung"
GITHUB_REPO = "tg_bot_memories"

# Todoist worker — RPC via Service Binding (same isolate, 1 billed request)
[[services]]
binding = "TODOIST"
service = "todoist-mcp"
entrypoint = "TodoistRpc"

# Housework tracker — RPC via Service Binding
[[services]]
binding = "HOUSEWORK"
service = "housework-tracker"
entrypoint = "HouseworkRpc"

# State (conversation history, per-topic area, soul/agents/memory docs) lives in the
# AgentDO's SQLite storage — see the durable_objects binding below. No KV needed.

# Free plan: no Queue. The slow LLM call runs in ctx.waitUntil after we ack Telegram.

# Workers AI — free models, no key. Enables the "cheap" area (env.AI binding).
[ai]
binding = "AI"

# Durable Object: the stateful agent. SQLite-backed (required + free on the Free plan).
[[durable_objects.bindings]]
name = "AGENT"
class_name = "AgentDO"
 
[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentDO"]